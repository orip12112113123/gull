version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gull
      POSTGRES_USER: gull
      POSTGRES_PASSWORD: gull_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://gull:gull_password@postgres:5432/gull"
      JWT_SECRET: "your-secret-key-change-in-production"
      PORT: 5000
      NODE_ENV: development
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
